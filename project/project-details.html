<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Project Details - SkillBridge</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    .page-container {
      max-width: 900px;
      margin: 0 auto;
      padding: 2.5rem 1.5rem 4rem;
    }
    .detail-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 1.25rem;
      padding: 1.25rem 0;
      border-top: 1px solid var(--color-border);
      border-bottom: 1px solid var(--color-border);
      margin: 1.5rem 0;
    }
    .detail-item-label {
      font-size: 0.8125rem;
      color: var(--color-text-muted);
      margin-bottom: 0.25rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .detail-item-value {
      font-size: 1.125rem;
      font-weight: 700;
      color: var(--color-text);
    }
    .proposals-list {
      display: flex;
      flex-direction: column;
      gap: 1.25rem;
    }
    .proposal-card {
      padding: 1.5rem;
    }
  </style>
  <script src="js/storage.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/projects.js"></script>
  <script src="js/users.js"></script>
  <script src="js/proposals.js"></script>
  <script>
    // Route guard for project details (client view)
    const currentUser = requireRole('client');
  </script>
</head>
<body>
  <!-- Navigation Bar -->
  <header>
    <nav class="navbar" id="top-navbar">
      <a href="index.html" class="nav-brand" id="brand-logo">
        Skill<span>Bridge</span>
      </a>
      <ul class="nav-links">
        <li><a href="client-dashboard.html" class="nav-link">Dashboard</a></li>
        <li><a href="my-projects.html" class="nav-link">My Projects</a></li>
        <li><a href="post-project.html" class="nav-link">Post a Project</a></li>
        <li><a href="browse-freelancers.html" class="nav-link">Browse Freelancers</a></li>
      </ul>
      <div class="nav-actions">
        <button id="logout-btn" class="btn btn-outline" onclick="logout()">Logout</button>
      </div>
    </nav>
  </header>

  <main class="page-container" id="main-content">
    <div style="margin-bottom: 1.5rem;">
      <a href="my-projects.html" style="font-size: 0.875rem; color: var(--color-text-muted); display: inline-flex; align-items: center; gap: 0.25rem;">
        &larr; Back to My Projects
      </a>
    </div>

    <!-- Container populated dynamically -->
    <div id="project-details-container">
      <div class="card" style="padding: 2.5rem; text-align: center;">
        <p style="color: var(--color-text-muted);">Loading project details...</p>
      </div>
    </div>
  </main>

  <script>
    if (currentUser) {
      const urlParams = new URLSearchParams(window.location.search);
      const projectId = urlParams.get('id');
      const container = document.getElementById('project-details-container');

      function renderProjectDetails() {
        const project = getProjectById(projectId);

        if (!project) {
          container.innerHTML = `
            <div class="card" style="text-align: center; padding: 3rem 1.5rem;">
              <div style="margin-bottom: 1rem;">
                <span class="badge badge-rejected">Not Found</span>
              </div>
              <h2 style="font-size: 1.5rem; font-weight: 700; color: var(--color-text); margin-bottom: 0.5rem;">
                Project Not Found
              </h2>
              <p style="color: var(--color-text-muted); margin-bottom: 1.5rem; font-size: 0.95rem;">
                The project you are looking for does not exist or may have been removed.
              </p>
              <a href="my-projects.html" class="btn btn-primary">&larr; Return to My Projects</a>
            </div>
          `;
          return;
        }

        const badgeClass = getStatusBadgeClass(project.status);
        const formattedBudget = formatCurrency(project.budget);
        const deadlineFormatted = project.deadline ? new Date(project.deadline).toLocaleDateString() : 'Not specified';
        const createdFormatted = project.createdAt ? new Date(project.createdAt).toLocaleDateString() : 'N/A';

        // Skills tags
        const skillsHtml = Array.isArray(project.skillsNeeded) && project.skillsNeeded.length > 0
          ? project.skillsNeeded
              .map(s => `<span class="badge" style="background-color: rgba(37,99,235,0.08); color: var(--color-primary);">${escapeHtml(s)}</span>`)
              .join(' ')
          : '<span style="color: var(--color-text-muted); font-size: 0.875rem;">None specified</span>';

        // Fetch proposals for this project
        const proposals = getProposalsForProject(project.id);
        const allUsers = getAll('users');

        let proposalsHtml = '';
        if (proposals.length === 0) {
          proposalsHtml = `
            <div class="card" style="text-align: center; padding: 2.5rem 1.5rem;">
              <div style="margin-bottom: 0.75rem;">
                <span class="badge badge-open">No Proposals Yet</span>
              </div>
              <h4 style="font-size: 1.125rem; font-weight: 600; color: var(--color-text); margin-bottom: 0.375rem;">
                No proposals submitted yet
              </h4>
              <p style="color: var(--color-text-muted); font-size: 0.875rem; max-width: 440px; margin: 0 auto;">
                Freelancers browsing open projects will be able to submit their bids and proposals here.
              </p>
            </div>
          `;
        } else {
          proposalsHtml = `
            <div class="proposals-list">
              ${proposals.map(p => {
                const freelancer = allUsers.find(u => String(u.id) === String(p.freelancerId));
                const freelancerName = freelancer ? freelancer.name : 'Unknown Freelancer';
                const propBadgeClass = getStatusBadgeClass(p.status || 'PENDING');
                const formattedBid = formatCurrency(p.bidAmount || 0);

                const statusUpper = String(p.status || 'PENDING').toUpperCase();
                let actionButtonsHtml = '';

                if (statusUpper === 'PENDING') {
                  actionButtonsHtml = `
                    <div style="display: flex; gap: 0.75rem; justify-content: flex-end;">
                      <button class="btn btn-outline" style="padding: 0.4rem 0.875rem; font-size: 0.875rem;" onclick="handleRejectProposal('${escapeHtml(p.id)}')">
                        Reject
                      </button>
                      <button class="btn btn-primary" style="padding: 0.4rem 0.875rem; font-size: 0.875rem;" onclick="handleAcceptProposal('${escapeHtml(p.id)}')">
                        Accept
                      </button>
                    </div>
                  `;
                } else if (statusUpper === 'ACCEPTED') {
                  actionButtonsHtml = `
                    <div style="display: flex; justify-content: flex-end;">
                      <span class="badge badge-accepted" style="font-size: 0.8125rem; padding: 0.4rem 0.75rem;">
                        &#10003; Accepted Proposal
                      </span>
                    </div>
                  `;
                } else if (statusUpper === 'REJECTED') {
                  actionButtonsHtml = `
                    <div style="display: flex; justify-content: flex-end;">
                      <span class="badge badge-rejected" style="font-size: 0.8125rem; padding: 0.4rem 0.75rem;">
                        Rejected
                      </span>
                    </div>
                  `;
                }

                return `
                  <article class="card proposal-card" id="proposal-${escapeHtml(p.id)}">
                    <div style="display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 0.75rem; flex-wrap: wrap; gap: 0.5rem;">
                      <div>
                        <h4 style="font-size: 1.125rem; font-weight: 700; color: var(--color-text); margin: 0 0 0.25rem;">
                          ${freelancer ? `<a href="freelancer-profile.html?id=${encodeURIComponent(freelancer.id)}" style="color: inherit; text-decoration: none;">${escapeHtml(freelancerName)}</a>` : escapeHtml(freelancerName)}
                        </h4>
                        <div style="font-size: 0.8125rem; color: var(--color-text-muted);">
                          Bid Amount: <strong style="color: var(--color-text); font-size: 0.95rem;">${formattedBid}</strong>
                        </div>
                      </div>
                      <span class="badge ${propBadgeClass}">${escapeHtml(p.status || 'PENDING')}</span>
                    </div>

                    <p style="color: var(--color-text); font-size: 0.9375rem; line-height: 1.6; margin-bottom: 1.25rem; white-space: pre-line; background-color: var(--color-bg); padding: 1rem; border-radius: var(--radius);">
                      ${escapeHtml(p.message || 'No message provided.')}
                    </p>

                    ${actionButtonsHtml}
                  </article>
                `;
              }).join('')}
            </div>
          `;
        }

        container.innerHTML = `
          <!-- Project Info Card -->
          <article class="card" style="padding: 2.25rem 2rem; margin-bottom: 2.5rem;">
            <div style="display: flex; justify-content: space-between; align-items: flex-start; gap: 1rem; margin-bottom: 1rem; flex-wrap: wrap;">
              <h1 style="font-size: 1.875rem; font-weight: 800; color: var(--color-text); margin: 0; line-height: 1.25; flex: 1;">
                ${escapeHtml(project.title)}
              </h1>
              <span class="badge ${badgeClass}" style="font-size: 0.875rem; padding: 0.375rem 0.75rem;">
                ${escapeHtml(project.status)}
              </span>
            </div>

            <div class="detail-grid">
              <div>
                <div class="detail-item-label">Budget</div>
                <div class="detail-item-value" style="color: var(--color-primary);">${formattedBudget}</div>
              </div>
              <div>
                <div class="detail-item-label">Target Deadline</div>
                <div class="detail-item-value">${escapeHtml(deadlineFormatted)}</div>
              </div>
              <div>
                <div class="detail-item-label">Date Posted</div>
                <div class="detail-item-value" style="font-size: 1rem; font-weight: 600;">${escapeHtml(createdFormatted)}</div>
              </div>
            </div>

            <div style="margin-bottom: 1.75rem;">
              <h3 style="font-size: 1rem; font-weight: 700; color: var(--color-text); margin-bottom: 0.5rem;">
                Project Description
              </h3>
              <p style="color: var(--color-text); font-size: 0.95rem; line-height: 1.7; white-space: pre-line;">
                ${escapeHtml(project.description)}
              </p>
            </div>

            <div>
              <h3 style="font-size: 1rem; font-weight: 700; color: var(--color-text); margin-bottom: 0.5rem;">
                Required Skills
              </h3>
              <div style="display: flex; flex-wrap: wrap; gap: 0.5rem;">
                ${skillsHtml}
              </div>
            </div>
          </article>

          <!-- Proposals Section -->
          <section>
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.25rem;">
              <h2 style="font-size: 1.375rem; font-weight: 700; color: var(--color-text); margin: 0;">
                Submitted Proposals (${proposals.length})
              </h2>
            </div>
            ${proposalsHtml}
          </section>
        `;
      }

      window.handleAcceptProposal = function(propId) {
        acceptProposal(propId);
        renderProjectDetails();
      };

      window.handleRejectProposal = function(propId) {
        rejectProposal(propId);
        renderProjectDetails();
      };

      renderProjectDetails();
    }
  </script>
</body>
</html>
